version: '3.8'

services:
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_ecommerce_api
    ports:
      - "5434:5432"  # Different port than dev (5433)
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 3s
      timeout: 3s
      retries: 5
    # Don't persist data between test runs (comment out volume if you want fresh DB each time)
    tmpfs:
      - /tmp

  test_redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Different port than dev (6379)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    # Don't persist data between test runs
    tmpfs:
      - /tmp

volumes:
  test_postgres_data:
    driver: local
